name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Linux native GUI and repair prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 xvfb xauth

      - name: Install LayerLoom
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" "pytest>=8" "build>=1"

      - name: Install and check optional repair dependencies
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -e ".[headless]"
          python -c "import lib3mf, pymeshlab, pygltflib"

      - name: Diagnose install
        run: |
          python -m pip check
          layerloom-doctor

      - name: Run tests
        run: pytest

      - name: Exercise real GUI workflow (Linux virtual display)
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        env:
          LAYERLOOM_GUI_INTEGRATION: "1"
          LAYERLOOM_GUI_ARTIFACT_DIR: ${{ runner.temp }}/layerloom-gui
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_API: pyqt5
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest tests/test_gui_workflow.py -ra

      - name: Exercise real GUI workflow (native desktop)
        if: matrix.python-version == '3.12' && runner.os != 'Linux'
        env:
          LAYERLOOM_GUI_INTEGRATION: "1"
          LAYERLOOM_GUI_ARTIFACT_DIR: ${{ runner.temp }}/layerloom-gui
          QT_API: pyqt5
        run: python -m pytest tests/test_gui_workflow.py -ra

      - name: Upload GUI screenshots and diagnostics
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: ${{ runner.temp }}/layerloom-gui
          if-no-files-found: warn

      - name: CLI smoke test
        run: |
          layerloom-weave --input examples/tutorial_cmy_cubes.3mf --step 0.20 --output tutorial_cmy_cubes_woven.3mf --verbose
          python -c "from pathlib import Path; p=Path('tutorial_cmy_cubes_woven.3mf'); assert p.is_file() and p.stat().st_size > 0"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Contour repair CLI smoke test
        run: |
          python -m layerloom.contour_repair examples/tutorial_cmy_cubes.3mf "contour smoke output.3mf" --layer-height 0.20
          python -c "import json; from pathlib import Path; r=json.loads(Path('contour smoke output.report.json').read_text(encoding='utf-8')); assert r['status']=='ok' and r['exported_bands']>0"

      - name: Full Benchy reconstruction and export validation
        if: matrix.python-version == '3.12' && runner.os != 'macOS'
        run: |
          python -m layerloom.contour_repair examples/tutorial_cmy_benchy_cutup.3mf benchy_ci.3mf --layer-height 0.20
          python -c "import json; from pathlib import Path; r=json.loads(Path('benchy_ci.report.json').read_text(encoding='utf-8')); assert r['status']=='ok' and r['errors']==[]; assert r['exported_bands']==349 and len(r['layers'])==182; assert {m['token'] for layer in r['layers'] for m in layer['materials']}==set('cmy')"

  contour-compat:
    name: Contour / ${{ matrix.os }} / Shapely 2.0 + NumPy 1.x
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install supported older numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c tests/contour-compat-constraints.txt -e . "pytest>=8"

      - name: Diagnose core install
        run: |
          python -m pip check
          layerloom-doctor --skip-gui

      - name: Run tests with Earcut fallback
        run: python -m pytest -m "not gui"

      - name: Contour repair CLI smoke test
        run: |
          python -m layerloom.contour_repair examples/tutorial_cmy_cubes.3mf "contour smoke output.3mf" --layer-height 0.20
          python -c "import json; from pathlib import Path; r=json.loads(Path('contour smoke output.report.json').read_text(encoding='utf-8')); assert r['status']=='ok' and r['exported_bands']>0"
