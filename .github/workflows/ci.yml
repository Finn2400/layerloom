name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install LayerLoom
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: Diagnose install
        run: layerloom-doctor

      - name: Run tests
        run: pytest

      - name: CLI smoke test
        run: |
          layerloom-weave --input examples/tutorial_cmy_cubes.3mf --step 0.20 --output tutorial_cmy_cubes_woven.3mf --verbose
          python -c "from pathlib import Path; p=Path('tutorial_cmy_cubes_woven.3mf'); assert p.is_file() and p.stat().st_size > 0"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Contour repair CLI smoke test
        run: |
          python -m layerloom.contour_repair examples/tutorial_cmy_cubes.3mf "contour smoke output.3mf" --layer-height 0.20
          python -c "import json; from pathlib import Path; r=json.loads(Path('contour smoke output.report.json').read_text(encoding='utf-8')); assert r['status']=='ok' and r['exported_bands']>0"

  contour-compat:
    name: Contour / ${{ matrix.os }} / Shapely 2.0 + NumPy 1.x
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install supported older numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c tests/contour-compat-constraints.txt -e ".[gui,dev]"

      - name: Run tests with Earcut fallback
        run: python -m pytest

      - name: Contour repair CLI smoke test
        run: |
          python -m layerloom.contour_repair examples/tutorial_cmy_cubes.3mf "contour smoke output.3mf" --layer-height 0.20
          python -c "import json; from pathlib import Path; r=json.loads(Path('contour smoke output.report.json').read_text(encoding='utf-8')); assert r['status']=='ok' and r['exported_bands']>0"
