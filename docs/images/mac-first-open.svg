<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
<title id="title">Open LayerLoom for the first time</title><desc id="desc">Copy and open LayerLoom. If macOS blocks it, find Privacy and Security in System Settings and approve LayerLoom with Open Anyway. Illustration, not a screenshot.</desc>
<rect width="1080" height="310" rx="20" fill="#f3f5f8"/>
<g font-family="Arial, sans-serif" fill="#17212d">
<text x="28" y="38" font-size="22" font-weight="bold">First open · approve this app if macOS asks</text>
<g stroke="#d2dae4" fill="white"><rect x="28" y="60" width="320" height="205" rx="14"/><rect x="380" y="60" width="320" height="205" rx="14"/><rect x="732" y="60" width="320" height="205" rx="14"/></g>
<g font-size="18" font-weight="bold"><text x="48" y="95">1  Copy and open</text><text x="400" y="95">2  Find the approval</text><text x="752" y="95">3  Open LayerLoom</text></g>
<rect x="48" y="116" width="64" height="64" rx="13" fill="#39526a"/><text x="59" y="158" font-size="28" fill="white" font-weight="bold">LL</text>
<text x="128" y="150" font-size="18">LayerLoom.app</text><text x="48" y="208" font-size="16">Drag from the DMG to Applications.</text><text x="48" y="234" font-size="16">Open the copied app.</text>
<text x="400" y="140" font-size="17">System Settings</text><text x="400" y="174" font-size="17">→ Privacy &amp; Security</text><text x="400" y="214" font-size="16">Scroll to the message naming</text><text x="400" y="238" font-size="16">LayerLoom.</text>
<rect x="752" y="117" width="180" height="44" rx="10" fill="#176cce"/><text x="842" y="145" font-size="18" text-anchor="middle" fill="white">Open Anyway</text>
<text x="752" y="197" font-size="16">Confirm Open, then choose</text><text x="752" y="222" font-size="16" font-weight="bold">Try the example → Weave.</text>
<text x="28" y="291" font-size="13" fill="#5f6c7d">Illustration; macOS labels can vary. Download only from the LayerLoom project. No Terminal commands are needed for this approval.</text>
</g></svg>
