[project]
name = "layerloom"
version = "0.1.0"
description = "Weave your 3D prints into color—group 3MF layers into repeating bands."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Finn Beruldsen" }]
dependencies = [
  "numpy>=1.24",
  "trimesh>=4.3.0",
  "lxml>=5.2.0",
]

[project.scripts]
layerloom = "layerloom.__main__:main"
cut2color = "layerloom.__main__:main"  # temporary alias

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

