[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "layerloom"
version = "0.6.4a2"
description = "Layer-based 3MF color assignment, normalization, and woven multi-material 3MF generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Finn Beruldsen", email = "fpberuld@uh.edu" }
]
keywords = ["3mf", "3d-printing", "multi-material", "slicer", "color"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
  "lxml>=4.9",
  "mapbox-earcut>=1.0",
  "manifold3d>=3.2",
  "networkx>=2.8",
  "numpy>=1.23",
  # Numba's macOS Intel wheels stop at 0.61; other targets use its current NumPy support.
  "numba>=0.61.2,<0.62; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numba>=0.64; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "Pillow>=9.0",
  "rtree>=1.0",
  "shapely>=2.0",
  "scipy>=1.10",
  "trimesh>=4.6,<4.12",
]

[project.urls]
Homepage = "https://github.com/Finn2400/layerloom"
Repository = "https://github.com/Finn2400/layerloom"
Issues = "https://github.com/Finn2400/layerloom/issues"

[project.optional-dependencies]
desktop = [
  "pyinstaller==6.22.3",
]
gui = [
  "lib3mf>=2.3",
  "pygltflib>=1.16",
  "pyvista>=0.43",
  "pyvistaqt>=0.11",
  "qtpy>=2.4",
  "PyQt5>=5.15",
  # Riverbank publishes newer Qt5 wheels for macOS/Linux, but Windows stops here.
  "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
  "PyQt5-Qt5==5.15.19; sys_platform != 'win32'",
]
bench = [
  "matplotlib>=3.7",
  "pandas>=2.0",
]
analysis = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "Pillow>=9.0",
  "scikit-image>=0.22",
]
headless = [
  "lib3mf>=2.3",
  "pygltflib>=1.16",
  "pymeshlab>=2022.2",
]
dev = [
  "build>=1.0",
  "pytest>=8.0",
  "twine>=5.0",
  "scikit-image>=0.22",
]

[project.scripts]
layerloom-doctor = "layerloom.doctor:main"
layerloom-gui = "layerloom.gui_app:main"
layerloom-worker = "layerloom.worker:main"
layerloom-weave = "layerloom.weave:main"
layerloom-headless = "layerloom.headless:main"
layerloom-glb-compat = "layerloom.glb_compat:main"
layerloom-pattern-map = "layerloom.pattern_mapper:main"
layerloom-image-weave = "layerloom.image_weave:main"
layerloom-marbling-pattern = "layerloom.marbling_pattern:main"
layerloom-normalize = "layerloom.cli:normalize_main"
layerloom-benchmark-suite = "layerloom.benchmark_suite:main"
layerloom-simplified-speed-suite = "layerloom.simplified_speed_suite:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "layerloom",
  "layerloom.experimental_viewer",
  "layerloom.palettes",
  "layerloom.examples",
  "supporting_scripts",
]
namespaces = false

[tool.setuptools.package-data]
layerloom = [
  "assets/*.txt",
  "palettes/*.json",
]
"layerloom.examples" = [
  "*.3mf",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Require wheels for the managed runtime on every supported desktop target.
# This prevents macOS locking from silently selecting a wheel-only package
# that cannot be installed on Windows or Linux.
required-environments = [
  "python_version == '3.12' and sys_platform == 'win32' and platform_machine == 'AMD64'",
  "python_version == '3.12' and sys_platform == 'darwin' and platform_machine == 'arm64'",
  "python_version == '3.12' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
